<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuMind AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="app" id="app">

  <!-- LEFT: chats + projects -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">◉ <span>DocuMind AI Agent</span></div>
    <div class="side-actions">
      <button class="btn primary" id="newChatBtn">＋ New chat</button>
      <button class="btn" id="newProjectBtn">📁 New project</button>
    </div>
    <input class="search" id="searchInput" placeholder="Search chats…">
    <div class="side-list" id="sideList"></div>
  </aside>

  <!-- CENTER: chat -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn" title="Menu">☰</button>
      <h1 id="chatTitle">New chat</h1>
      <div class="top-actions">
        <button class="btn" id="toggleGraphBtn">⚡ Workflow</button>
      </div>
    </header>

    <section class="messages" id="messages"></section>

    <footer class="composer" id="composer">
      <div class="chips" id="chips"></div>
      <div class="composer-row">
        <button class="icon-btn" id="attachBtn" title="Attach file (pdf, txt, md, py, ipynb)">📎</button>
        <button class="icon-btn" id="imageBtn" title="Upload image">🖼️</button>
        <textarea id="input" rows="1" placeholder="Ask anything… (Enter = send, Shift+Enter = new line)"></textarea>
        <button class="icon-btn" id="micBtn" title="Record voice → transcribe">🎙️</button>
        <button class="btn primary send" id="sendBtn" title="Send">➤</button>
      </div>
      <input type="file" id="fileInput" multiple hidden accept=".pdf,.txt,.md,.py,.ipynb,.csv,.json">
      <input type="file" id="imageInput" multiple hidden accept="image/*">
    </footer>
  </main>

  <!-- RIGHT: animated workflow -->
  <aside class="right" id="graphPanel">
    <div class="right-head">
      <strong>Workflow</strong>
      <span class="status" id="graphStatus">Idle</span>
    </div>
    <div class="graph-wrap"><svg id="graph" viewBox="0 0 505 790" preserveAspectRatio="xMidYMin meet"></svg></div>
    <div class="legend">
      <span><i class="dot idle"></i>idle</span>
      <span><i class="dot active"></i>running</span>
      <span><i class="dot done"></i>done</span>
    </div>
    <div class="log" id="graphLog"></div>
  </aside>

  <!-- DRAWER: image detail -->
  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <strong id="drawerTitle">Image</strong>
      <button class="icon-btn" id="drawerClose" title="Close">✕</button>
    </div>
    <div class="drawer-body">
      <img id="drawerImg" alt="">
      <p class="muted" id="drawerCap"></p>
      <div class="drawer-links" id="drawerLinks"></div>
      <div class="thread" id="drawerThread"></div>
    </div>
    <div class="drawer-ask">
      <input id="drawerInput" placeholder="Ask about this image…">
      <button class="btn primary" id="drawerSend">Ask</button>
    </div>
  </aside>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg" class="muted"></p>
    <input id="dlgInput" autocomplete="off">
    <select id="dlgSelect"></select>
    <div class="dlg-actions">
      <button type="button" class="btn" id="dlgCancel">Cancel</button>
      <button type="submit" class="btn primary" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=4"></script>
</body>
</html>
